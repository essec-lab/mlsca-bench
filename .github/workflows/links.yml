name: Dataset links

# Weekly check that every dataset can still be downloaded from its source:
# HTTP and Google Drive files return real data (not a web page or a Git LFS
# stub), and Dataverse, Google Cloud and Hugging Face datasets still list
# their files. A failure opens (or updates) an issue labelled "broken-link".

on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[huggingface]"
      - name: Check every dataset link
        run: python scripts/check_links.py | tee links.txt
      - name: Report broken links as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'The weekly link check found problems (run: %s).\n\n```\n%s\n```\n' \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "$(grep -A1 '^PROBLEM' links.txt; tail -1 links.txt)")"
          gh label create broken-link --color B60205 --description "A dataset link no longer works" 2>/dev/null || true
          existing="$(gh issue list --label broken-link --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Broken dataset links" --label broken-link --body "$body"
          fi
