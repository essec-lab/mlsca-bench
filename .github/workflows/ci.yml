name: CI

on:
  push:
    branches: [main, clean-datasets]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:                       # other processors: Linux on ARM, an Intel Mac
          - {os: ubuntu-24.04-arm, python: "3.12"}
          - {os: macos-15-intel, python: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (core + test extras, no PyTorch)
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q

  tests-deep-learning:
    name: Tests with PyTorch (${{ matrix.os }}, CPU)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: PyTorch publishes Intel-Mac builds only up to 2.2 (Python <= 3.12).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PyTorch (CPU build)
        if: runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyTorch (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install torch
      - name: Install (test + eval extras)
        if: matrix.os != 'macos-15-intel'
        run: python -m pip install -e ".[test,eval]"
      - name: Install on the Intel Mac (PyTorch 2.2 needs NumPy 1, as the README says)
        if: matrix.os == 'macos-15-intel'
        run: python -m pip install -e ".[test,eval]" "numpy<2"
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: The wheel contains exactly the files in git
        run: |
          git ls-files src/mlsca_bench | sed 's#^src/##' | grep -v '\.pyc$' | sort > expected.txt
          python -c "import zipfile, glob; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); print('\n'.join(sorted(n for n in names if n.startswith('mlsca_bench/'))))" > packaged.txt
          diff expected.txt packaged.txt
      - name: Install the wheel and import it
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import mlsca_bench as m; assert len(m.list_datasets()) == 64"
