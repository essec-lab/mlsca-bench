[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlsca-bench"
version = "0.1.0"
description = "Public side-channel datasets, baselines and metrics for machine-learning side-channel analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Iris Dania Jimenez", email = "iris.jimenez@unibw.de" },
    { name = "Michael Hutter", email = "michael.hutter@unibw.de" },
]
keywords = [
    "side-channel analysis",
    "sca",
    "deep learning",
    "power analysis",
    "cryptography",
    "datasets",
    "benchmark",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pooch>=1.9,<2",
    "requests>=2.25,<3",
    "tqdm>=4.66,<5",
]


[project.scripts]
mlsca-bench = "mlsca_bench.cli:main"

[project.urls]
Homepage = "https://github.com/essec-lab/mlsca-bench"
Repository = "https://github.com/essec-lab/mlsca-bench"
Issues = "https://github.com/essec-lab/mlsca-bench/issues"

[project.optional-dependencies]
hdf5 = ["h5py>=3.10"]
matlab = ["scipy>=1.10"]
pickle = ["pandas>=2,<4"]
eval = ["torch>=2,<3"]
plot = ["matplotlib>=3.7"]
gdrive = ["gdown>=5.2"]
gcs = ["google-cloud-storage>=2,<4"]
huggingface = ["huggingface-hub>=0.25,<2"]
sevenzip = ["py7zr>=0.22"]
zstd = ["zstandard>=0.22; python_version < '3.14'"]
all = [
    "gdown>=5.2",
    "google-cloud-storage>=2,<4",
    "h5py>=3.10",
    "huggingface-hub>=0.25,<2",
    "matplotlib>=3.7",
    "pandas>=2,<4",
    "py7zr>=0.22",
    "scipy>=1.10",
    "zstandard>=0.22; python_version < '3.14'",
]
test = [
    "h5py>=3.10",
    "matplotlib>=3.7",
    "pandas>=2,<4",
    "pytest>=8,<10",
    "scipy>=1.10",
    "zstandard>=0.22; python_version < '3.14'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mlsca_bench" = ["py.typed"]
"mlsca_bench.datasets" = ["registry.json"]
"mlsca_bench.benchmark" = ["splits.json"]
